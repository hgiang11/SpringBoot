<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${formTitle} + ' - Chicken Shop'">Form danh mục</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
</head>
<body>

<header class="admin-bar">
    <a th:href="@{/admin/products}" class="admin-logo">🍗 Chicken Shop · Quản trị</a>
    <nav>
        <a th:href="@{/admin/products}">Món ăn</a>
        <a th:href="@{/admin/categories}">Danh mục</a>
        <a th:href="@{/admin/orders}">Đơn hàng</a>
        <a th:href="@{/menu}">Xem trang khách</a>
    </nav>
</header>

<main class="admin-main">
    <h1 th:text="${formTitle}">Thêm danh mục</h1>

    <form th:action="@{/admin/categories/save}" th:object="${categoryForm}"
          method="post" class="admin-form">

        <input type="hidden" th:field="*{id}">

        <div class="field">
            <label for="name">Tên danh mục *</label>
            <input type="text" id="name" th:field="*{name}">
            <span class="error" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></span>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">Lưu</button>
            <a th:href="@{/admin/categories}" class="btn">Hủy</a>
        </div>
    </form>
</main>
</body>
</html>
