<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quản lý đơn hàng - Chicken Shop</title>
    <link rel="stylesheet" th:href="@{/css/admin.css}">
    <link rel="stylesheet" th:href="@{/css/order.css}">
</head>
<body>

<header class="admin-bar">
    <a th:href="@{/admin/products}" class="admin-logo">🍗 Chicken Shop · Quản trị</a>
    <nav>
        <a th:href="@{/admin/products}">Món ăn</a>
        <a th:href="@{/admin/categories}">Danh mục</a>
        <a th:href="@{/admin/orders}">Đơn hàng</a>
        <a th:href="@{/menu}">Xem trang khách</a>
    </nav>
</header>

<main class="admin-main">
    <div class="admin-title">
        <h1>Quản lý đơn hàng</h1>
    </div>

    <!-- Lọc theo trạng thái -->
    <div class="status-actions">
        <a th:href="@{/admin/orders}" class="btn btn-small"
           th:classappend="${selectedStatus == null} ? 'btn-primary'">Tất cả</a>
        <a th:each="s : ${statuses}"
           th:href="@{/admin/orders(status=${s})}"
           th:text="${s.label}"
           class="btn btn-small"
           th:classappend="${selectedStatus == s} ? 'btn-primary'">Trạng thái</a>
    </div>

    <table class="admin-table" style="margin-top:16px;">
        <thead>
        <tr>
            <th>Mã đơn</th>
            <th>Khách hàng</th>
            <th>Ngày đặt</th>
            <th>Tổng tiền</th>
            <th>Trạng thái</th>
            <th>Thao tác</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="o : ${orders.content}">
            <td th:text="'#' + ${o.id}">#1</td>
            <td th:text="${o.user.fullName}">Khách</td>
            <td th:text="${#temporals.format(o.orderDate, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
            <td th:text="${#numbers.formatDecimal(o.totalPrice, 0, 'POINT', 0, 'COMMA')} + ' đ'">0 đ</td>
            <td><span class="status" th:classappend="'status-' + ${o.status}"
                      th:text="${o.status.label}">Chờ xác nhận</span></td>
            <td><a th:href="@{/admin/orders/{id}(id=${o.id})}" class="btn btn-small">Chi tiết</a></td>
        </tr>
        <tr th:if="${orders.empty}">
            <td colspan="6" class="empty">Không có đơn hàng nào.</td>
        </tr>
        </tbody>
    </table>

    <div class="pager" th:if="${orders.totalPages > 1}">
        <a th:each="i : ${#numbers.sequence(0, orders.totalPages - 1)}"
           th:href="@{/admin/orders(page=${i}, status=${selectedStatus})}"
           th:text="${i + 1}"
           th:classappend="${i == orders.number} ? 'active'">1</a>
    </div>
</main>
</body>
</html>
