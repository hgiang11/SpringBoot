<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="i18n-error" th:content="${#messages.msg('common.error')}">
    <meta name="i18n-qty-range" th:content="${#messages.msg('cart.qtyRange', 20)}">    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">
    <title>Giỏ hàng - Chicken Shop</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/cart.css}">
    <script th:src="@{/css/js/cart.js}" defer></script>
</head>
<body class="jollibee-bg">

<header th:replace="~{fragments/header :: header(${active})}"></header>

<main class="cart-main">
    <h1 th:text="#{cart.title}">Giỏ hàng của bạn</h1>

    <div class="toast" th:if="${message}" th:text="${message}"></div>
    <div class="toast toast-error" th:if="${error}" th:text="${error}"></div>

    <div class="cart-empty" th:if="${#lists.isEmpty(cart.items)}">
        <p th:text="#{cart.empty}">Giỏ hàng của bạn đang trống.</p>
        <a th:href="@{/menu}" class="btn-continue" th:text="#{cart.viewMenu}">Xem thực đơn</a>
    </div>

    <div th:unless="${#lists.isEmpty(cart.items)}">
        <table class="cart-table">
            <thead>
            <tr>
                <th th:text="#{cart.col.item}">Món</th>
                <th th:text="#{cart.col.price}">Đơn giá</th>
                <th th:text="#{cart.col.qty}">Số lượng</th>
                <th th:text="#{cart.col.subtotal}">Thành tiền</th>
                <th></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${cart.items}">
                <td>
                    <strong th:text="${item.product.localizedName(#locale.language)}">Tên món</strong>
                    <span class="unavailable" th:unless="${item.product.available}"
                          th:text="#{cart.unavailable}">Món đã ngừng bán</span>
                </td>
                <td th:text="${#numbers.formatDecimal(item.product.price, 0, 'POINT', 0, 'COMMA')} + ' ₫'">35.000 ₫</td>
                <td>
                    <form th:action="@{/cart/items/{id}/update(id=${item.id})}" method="post"
                          class="qty-form js-qty-form"
                          th:attr="data-url=@{/api/cart/items/{id}(id=${item.id})}">
                        <input type="number" name="quantity" th:value="${item.quantity}" min="1" max="20">
                        <button type="submit" class="btn-small" th:text="#{cart.update}">Cập nhật</button>
                    </form>
                </td>
                <td class="js-subtotal"
                    th:text="${#numbers.formatDecimal(item.subtotal, 0, 'POINT', 0, 'COMMA')} + ' ₫'">70.000 ₫</td>
                <td>
                    <form th:action="@{/cart/items/{id}/remove(id=${item.id})}" method="post"
                          class="js-remove-form"
                          th:attr="data-url=@{/api/cart/items/{id}(id=${item.id})}">
                        <button type="submit" class="btn-small btn-remove" th:text="#{cart.remove}">Xóa</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>

        <div class="cart-summary">
            <div class="cart-total">
                <span th:text="#{cart.total}">Tổng cộng:</span>
                <strong data-cart-total
                        th:text="${#numbers.formatDecimal(cart.total, 0, 'POINT', 0, 'COMMA')} + ' ₫'">0 ₫</strong>
            </div>
            <div class="cart-actions">
                <a th:href="@{/menu}" class="btn-continue" th:text="#{cart.continue}">Tiếp tục chọn món</a>
                <a th:href="@{/checkout}" class="btn-checkout" th:text="#{cart.checkout}">Thanh toán</a>
            </div>
        </div>
    </div>
</main>
</body>
</html>
