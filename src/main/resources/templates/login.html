<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.title} + ' - ' + #{brand.name}">Đăng nhập</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="auth-card">
    <div class="auth-lang">
        <a href="?lang=vi">VN</a> | <a href="?lang=en">EN</a>
    </div>
    <a th:href="@{/menu}" class="auth-back" th:text="#{login.back}">← Về thực đơn</a>
    <h1>🍗 <span th:text="#{login.title}">Đăng nhập</span></h1>

    <div class="toast" th:if="${message}" th:text="${message}"></div>
    <div class="toast toast-error" th:if="${param.error}" th:text="#{login.error}">Sai tên đăng nhập hoặc mật khẩu</div>
    <div class="toast" th:if="${param.logout}" th:text="#{login.loggedOut}">Bạn đã đăng xuất</div>

    <form th:action="@{/login}" method="post">
        <div class="field">
            <label for="username" th:text="#{login.username}">Tên đăng nhập</label>
            <input type="text" id="username" name="username" autofocus>
        </div>
        <div class="field">
            <label for="password" th:text="#{login.password}">Mật khẩu</label>
            <input type="password" id="password" name="password">
        </div>
        <button type="submit" class="btn-auth" th:text="#{login.submit}">ĐĂNG NHẬP</button>
    </form>

    <p class="auth-switch"><span th:text="#{login.noAccount}">Chưa có tài khoản?</span>
        <a th:href="@{/register}" th:text="#{login.registerLink}">Đăng ký</a></p>
</main>
</body>
</html>
