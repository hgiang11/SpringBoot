<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đơn hàng của tôi - Chicken Shop</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/cart.css}">
    <link rel="stylesheet" th:href="@{/css/order.css}">
</head>
<body class="jollibee-bg">

<header th:replace="~{fragments/header :: header(${active})}"></header>

<main class="cart-main">
    <h1>Đơn hàng của tôi</h1>

    <div class="toast" th:if="${message}" th:text="${message}"></div>
    <div class="toast toast-error" th:if="${error}" th:text="${error}"></div>

    <div class="cart-empty" th:if="${#lists.isEmpty(orders)}">
        <p>Bạn chưa có đơn hàng nào.</p>
        <a th:href="@{/menu}" class="btn-continue">Xem thực đơn</a>
    </div>

    <table class="cart-table" th:unless="${#lists.isEmpty(orders)}">
        <thead>
        <tr>
            <th>Mã đơn</th>
            <th>Ngày đặt</th>
            <th>Tổng tiền</th>
            <th>Trạng thái</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="o : ${orders}">
            <td th:text="'#' + ${o.id}">#1</td>
            <td th:text="${#temporals.format(o.orderDate, 'dd/MM/yyyy HH:mm')}">01/01/2026 10:00</td>
            <td th:text="${#numbers.formatDecimal(o.totalPrice, 0, 'POINT', 0, 'COMMA')} + ' ₫'">0 ₫</td>
            <td><span class="status" th:classappend="'status-' + ${o.status}"
                      th:text="${o.status.label}">Chờ xác nhận</span></td>
            <td><a th:href="@{/orders/{id}(id=${o.id})}" class="btn-small">Xem</a></td>
        </tr>
        </tbody>
    </table>
</main>

</body>
</html>
