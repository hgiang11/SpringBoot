<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{register.title} + ' - ' + #{brand.name}">Đăng ký</title>
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>
<body>
<main class="auth-card">
    <div class="auth-lang">
        <a href="?lang=vi">VN</a> | <a href="?lang=en">EN</a>
    </div>
    <a th:href="@{/menu}" class="auth-back" th:text="#{login.back}">← Về thực đơn</a>
    <h1>🍗 <span th:text="#{register.title}">Đăng ký tài khoản</span></h1>

    <form th:action="@{/register}" th:object="${registerForm}" method="post">

        <div class="field">
            <label for="username" th:text="#{register.username}">Tên đăng nhập *</label>
            <input type="text" id="username" th:field="*{username}">
            <span class="error" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
        </div>

        <div class="field">
            <label for="password" th:text="#{register.password}">Mật khẩu *</label>
            <input type="password" id="password" th:field="*{password}">
            <span class="error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </div>

        <div class="field">
            <label for="confirmPassword" th:text="#{register.confirm}">Nhập lại mật khẩu *</label>
            <input type="password" id="confirmPassword" th:field="*{confirmPassword}">
            <span class="error" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
        </div>

        <div class="field">
            <label for="fullName" th:text="#{register.fullName}">Họ tên *</label>
            <input type="text" id="fullName" th:field="*{fullName}">
            <span class="error" th:if="${#fields.hasErrors('fullName')}" th:errors="*{fullName}"></span>
        </div>

        <div class="field">
            <label for="phone" th:text="#{register.phone}">Số điện thoại *</label>
            <input type="text" id="phone" th:field="*{phone}">
            <span class="error" th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></span>
        </div>

        <div class="field">
            <label for="address" th:text="#{register.address}">Địa chỉ</label>
            <input type="text" id="address" th:field="*{address}">
            <span class="error" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></span>
        </div>

        <button type="submit" class="btn-auth" th:text="#{register.submit}">ĐĂNG KÝ</button>
    </form>

    <p class="auth-switch"><span th:text="#{register.haveAccount}">Đã có tài khoản?</span>
        <a th:href="@{/login}" th:text="#{register.loginLink}">Đăng nhập</a></p>
</main>
</body>
</html>
